<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; connect-src https://api.github.com; base-uri 'self'; form-action 'none'">
    <title>GitHub Badge Linker</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="language-panel" aria-label="Language selector">
        <label for="languageSelect" class="language-label" data-i18n="languageLabel">Language</label>
        <select id="languageSelect" class="language-select"></select>
    </div>

    <main class="editorial-shell">
        <section class="split-layout" aria-label="Badge linker workspace">
            <aside class="brand-column">
                <p class="section-label" data-i18n="topLabel">Utility</p>
                <h1 data-i18n="title">GitHub Badge Linker</h1>
                <p class="dek" data-i18n="subtitle">Convert raw badge image tags into repository-linked snippets with one pass.</p>
                <div class="brand-note">
                    <span data-i18n="contextLabel">Context</span>
                    <p data-i18n="supportCopy">Enter your profile, paste badge tags, and export production-ready README markup in seconds.</p>
                </div>
            </aside>

            <section class="workspace-column">
                <!-- Main profile URL -->
                <div class="field-block">
                    <label for="githubUrl" class="field-label" data-i18n="githubLabel">GitHub profile URL</label>
                    <input type="text" id="githubUrl" data-i18n-placeholder="githubPlaceholder" placeholder="https://github.com/username">
                </div>

                <!-- Organization URLs (dynamic) -->
                <div class="field-block org-block">
                    <div class="org-header">
                        <span class="field-label" data-i18n="orgLabel">Organization URLs (optional)</span>
                        <button type="button" class="org-add-btn" id="orgAddBtn" title="Add organization URL" aria-label="Add organization URL" data-i18n-title="orgAddTitle">+</button>
                    </div>
                    <div id="orgUrlList" class="org-url-list">
                        <!-- dynamic rows inserted here by JS -->
                    </div>
                </div>

                <div class="field-block">
                    <label for="badgesInput" class="field-label" data-i18n="badgesLabel">Paste badge HTML (&lt;img&gt; tags)</label>
                    <textarea id="badgesInput" rows="8" data-i18n-placeholder="badgesPlaceholder" placeholder='<img src="https://img.shields.io/badge/Vercel-3e80ed?style=for-the-badge&logo=vercel&logoColor=white" />'></textarea>
                </div>

                <div class="field-block format-block">
                    <span class="field-label" data-i18n="formatLabel">Output format</span>
                    <div class="format-toggle" role="radiogroup" aria-label="Output format" data-i18n-aria-label="formatLabel">
                        <label class="format-option">
                            <input type="radio" name="outputFormat" value="html" checked>
                            <span>HTML</span>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="outputFormat" value="markdown">
                            <span>Markdown</span>
                        </label>
                    </div>
                </div>

                <div class="action-row">
                    <button class="generate-btn" type="button" data-action="generate" data-i18n="generateButton">Generate code</button>
                    <button class="copy-btn" type="button" data-action="copy" data-i18n="copyButton">Copy code</button>
                </div>

                <div id="statusMessage" class="status" role="status" aria-live="polite"></div>

                <div class="field-block output-block">
                    <label for="resultOutput" class="field-label" data-i18n="resultLabel">Generated code for README.md</label>
                    <textarea id="resultOutput" rows="12" readonly></textarea>
                </div>

                <div id="matchSummary" class="match-summary-container" tabindex="0"></div>
            </section>
        </section>
    </main>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
